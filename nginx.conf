# Misantropic — Nginx front end for Docker mode
#
# Topology this file implements:
#
#   browser --:7000--> nginx --http--> backend:7000 (uvicorn/FastAPI)
#
# The backend serves the whole single-origin app: the static UI at `/` and
# `/static/`, and the JSON API under `/api/`. There is no separate frontend
# build step in this project, so nginx is a reverse proxy, not a static web
# root. See `location /static/` below for the optional direct-serve tuning.
#
# Requirements covered:
#   * proxy /api/ to backend:7000
#   * SSE streaming (chat token streaming must not be buffered)
#   * WebSocket upgrade
#   * cookie preservation
#   * long-running LLM requests (default nginx read timeout is 60s — far too
#     short for local model generation)

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Uploads: documents, images, email attachments. 0 = no limit.
    client_max_body_size 0;

    # `Connection` must be rewritten per-request for both SSE and WebSockets.
    # An empty value disables keep-alive hop-by-hop headers for SSE; "upgrade"
    # switches the connection for WebSockets. One map serves both.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Long-lived streams: keep the upstream socket open well past any single
    # model generation, and let the client sit idle without being cut off.
    proxy_http_version 1.1;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 60s;

    # Preserve the original request context for the app's auth/origin checks.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Cookies pass through untouched (nginx forwards them by default); this is
    # explicit so nobody later "optimises" it away. Sessions are cookie-based.
    proxy_set_header Cookie            $http_cookie;

    server {
        listen 7000;
        server_name _;

        # ---- JSON API ----------------------------------------------------
        location /api/ {
            proxy_pass http://backend:7000;

            # SSE: never buffer or cache a token stream.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_set_header Connection $connection_upgrade;

            # Send tokens as they arrive rather than in 4k frames.
            proxy_max_temp_file_size 0;
            gzip off;
        }

        # ---- WebSockets --------------------------------------------------
        # Kept separate from /api/ so a future ws endpoint anywhere is covered.
        location /ws {
            proxy_pass http://backend:7000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # ---- Static UI (served by the backend) ---------------------------
        # The app already serves these with a revalidating cache policy, so the
        # default is to pass through. To let nginx serve them directly instead
        # (requires `static/` bind-mounted into this container), replace the
        # proxy_pass below with:
        #     root /usr/share/nginx/html;
        #     try_files $uri @backend;
        # and add the `@backend` named location pointing at http://backend:7000.
        location /static/ {
            proxy_pass http://backend:7000;
            proxy_buffering off;
        }

        # ---- Everything else (/, SPA-ish paths, favicon, health) ---------
        location / {
            proxy_pass http://backend:7000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Streamed HTML/JSON passes straight through.
            proxy_buffering off;
        }
    }
}
